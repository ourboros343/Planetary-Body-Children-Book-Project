    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
            user-select: none;
        }
        
        .font-heading {
            font-family: 'Fredoka', cursive, sans-serif;
        }

        /* Starfield canvas styling */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Page Flip Animation effect */
        .book-container {
            perspective: 1500px;
        }

        .book-card {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1), opacity 0.4s ease;
            transform-style: preserve-3d;
        }

        .flip-next {
            animation: flipOutLeft 0.5s forwards ease-in-out;
        }

        .flip-prev {
            animation: flipOutRight 0.5s forwards ease-in-out;
        }

        @keyframes flipOutLeft {
            0% { transform: rotateY(0deg) scale(1); opacity: 1; }
            50% { transform: rotateY(-30deg) scale(0.95); opacity: 0.5; }
            100% { transform: rotateY(0deg) scale(1); opacity: 1; }
        }

        @keyframes flipOutRight {
            0% { transform: rotateY(0deg) scale(1); opacity: 1; }
            50% { transform: rotateY(30deg) scale(0.95); opacity: 0.5; }
            100% { transform: rotateY(0deg) scale(1); opacity: 1; }
        }

        /* Custom Scrollbar for book content */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.4);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(236, 72, 153, 0.7);
        }

        /* Pulsing Glow Effect */
        .glow-jupiter {
            box-shadow: 0 0 35px rgba(234, 114, 45, 0.35);
        }

        .glow-europa {
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.35);
        }

        /* Great Red Spot Storm Animation */
        @keyframes stormSwirl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .storm-spin {
            animation: stormSwirl 25s linear infinite;
        }

        /* Floating Bobbing Effect */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        .animate-float {
            animation: floatSlow 5s ease-in-out infinite;
        }
    </style>

    <!-- Audio Synth Simulation via Web Audio API -->
    <script>
        // Web Audio API ambient noise synthesizer (no external assets required)
        let audioCtx = null;
        let isAudioPlaying = false;
        let ambientGain = null;

        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            // Low frequency ambient cosmic drone
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            ambientGain = audioCtx.createGain();

            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(55, audioCtx.currentTime); // A1 note
            
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(110, audioCtx.currentTime); // A2 note

            // Filter for deep space atmosphere
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(220, audioCtx.currentTime);

            ambientGain.gain.setValueAtTime(0.05, audioCtx.currentTime);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(ambientGain);
            ambientGain.connect(audioCtx.destination);

            osc1.start();
            osc2.start();
        }

        function toggleAudio() {
            if (!audioCtx) initAudio();
            const label = document.getElementById('soundLabel');
            const icon = document.getElementById('soundIcon');

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isAudioPlaying) {
                ambientGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                label.innerText = 'Space Ambient: OFF';
                icon.setAttribute('data-lucide', 'volume-x');
                isAudioPlaying = false;
            } else {
                ambientGain.gain.exponentialRampToValueAtTime(0.05, audioCtx.currentTime + 0.5);
                label.innerText = 'Space Ambient: ON';
                icon.setAttribute('data-lucide', 'volume-2');
                isAudioPlaying = true;
            }
            lucide.createIcons();
        }

        function playBeep(freq = 440) {
            if (!audioCtx || !isAudioPlaying) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {}
        }
    </script>

    <!-- Starfield Animation Script -->
    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            stars = [];
            const count = Math.floor((canvas.width * canvas.height) / 3000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let star of stars) {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                ctx.fill();
            }
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawStars();
    </script>

        let currentPageIndex = 0;

        // Initialize Page Navigation dropdown options
        function buildPageDropdown() {
            const select = document.getElementById('pageSelect');
            select.innerHTML = '';
            
            pages.forEach((page, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.innerText = index === 0 ? "Cover Page" : `Page ${index}: ${page.title.split(':')[1] || page.title}`;
                select.appendChild(opt);
            });
        }

        // Render Page Content
        function renderPage(index) {
            const container = document.getElementById('pageContent');
            const page = pages[index];

            // Update footer progress indicators
            document.getElementById('pageProgressLabel').innerText = index === 0 ? "Cover Page" : `Page ${index} of 12`;
            document.getElementById('pageCounter').innerText = `${index} / 12`;
            document.getElementById('progressBar').style.width = `${(index / 12) * 100}%`;
            document.getElementById('pageSelect').value = index;

            // Enable/Disable buttons
            document.getElementById('prevBtn').disabled = (index === 0);
            document.getElementById('nextBtn').disabled = (index === pages.length - 1);

            if (page.type === 'cover') {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center text-center py-4">
                        <span class="px-3 py-1 bg-amber-500/20 border border-amber-500/40 text-amber-300 font-semibold text-xs rounded-full uppercase tracking-wider mb-2">

                        <h2 class="text-sm sm:text-lg font-medium text-slate-300 mb-2">

                    <div class="flex flex-col h-full justify-between">

            lucide.createIcons();

        // Change Page Function
        function changePage(direction) {
            const bookCard = document.getElementById('bookCard');
            
            // Animation class based on direction
            if (direction > 0) {
                bookCard.classList.add('flip-next');
            } else {
                bookCard.classList.add('flip-prev');
            }

            playBeep(350 + (currentPageIndex * 30));

            setTimeout(() => {
                currentPageIndex += direction;
                if (currentPageIndex < 0) currentPageIndex = 0;
                if (currentPageIndex >= pages.length) currentPageIndex = pages.length - 1;
                renderPage(currentPageIndex);
                bookCard.classList.remove('flip-next', 'flip-prev');
            }, 250);
        }

        function jumpToPage(index) {
            currentPageIndex = parseInt(index);
            renderPage(currentPageIndex);
            playBeep(400);
        }

        // --- Interactive Widget Handler Functions ---

        // Page 2: Storm Speedup
        function speedUpStorm() {
            stormSpeedMultiplier += 0.5;
            if (stormSpeedMultiplier > 4) stormSpeedMultiplier = 1;
            const core = document.getElementById('stormCore');
            const text = document.getElementById('stormSpeedText');
            
            core.style.animationDuration = `${25 / stormSpeedMultiplier}s`;
            const speed = Math.round(430 * stormSpeedMultiplier);
            core.innerText = `${speed} MPH`;
            text.innerText = `Storm speed boosted to ${speed} MPH!`;
            playBeep(500 + (stormSpeedMultiplier * 100));
        }

        // Page 3: Gravity Calculator
        function calculateJupiterWeight() {
            const input = document.getElementById('earthWeightInput');
            const result = document.getElementById('jupWeightResult');
            const earthW = parseFloat(input.value) || 0;
            const jupW = Math.round(earthW * 2.53);
            result.innerText = `${jupW} lbs`;
        }

        // Page 4: Layer Inspector
        function inspectLayer(title, detail) {
            const box = document.getElementById('layerDetailBox');
            box.innerHTML = `<strong>${title}:</strong> ${detail}`;
            playBeep(450);
        }

        // Page 6: Aurora Spark Effect
        function triggerAuroraEffect() {
            const card = document.getElementById('bookCard');
            card.style.boxShadow = '0 0 50px rgba(16, 185, 129, 0.6)';
            playBeep(800);
            setTimeout(() => {
                card.style.boxShadow = '';
            }, 1200);
        }

        // Page 11: Probe Game Variables
        let probeY = 50; // percentage
        function moveProbe(dir) {
            const probe = document.getElementById('playerProbe');
            if (dir === 'up') probeY = Math.max(10, probeY - 20);
            if (dir === 'down') probeY = Math.min(80, probeY + 20);
            probe.style.transform = `translateY(${probeY - 50}px)`;
            playBeep(300);
        }

        function launchProbe() {
            const probe = document.getElementById('playerProbe');
            const status = document.getElementById('gameStatus');
            probe.style.transition = 'all 1.5s ease-in-out';
            probe.style.left = '75%';

            setTimeout(() => {
                if (probeY >= 30 && probeY <= 70) {
                    status.innerText = "🎯 SUCCESS! Probe successfully entered Europa's orbit!";
                    status.className = "text-xs text-emerald-400 font-bold mt-2 animate-bounce";
                    playBeep(700);
                } else {
                    status.innerText = "⚠️ MISSED! Gravity slingshot lost the probe. Try again!";
                    status.className = "text-xs text-red-400 font-bold mt-2";
                    playBeep(200);
                }
            }, 1500);
        }

        // Page 12: Quiz Check
        function checkQuizAnswer(isCorrect) {
            const feedback = document.getElementById('quizFeedback');
            if (isCorrect) {
                feedback.innerHTML = "<span class='text-emerald-400'>Correct! Jupiter is primarily composed of Hydrogen and Helium!</span>";
                playBeep(600);
            } else {
                feedback.innerHTML = "<span class='text-red-400'> Wrong! Remember, Jupiter is made of Hydrogen and Helium gas.</span>";
                playBeep(250);
            }
        }

        
        window.onload = function() {
            buildPageDropdown();
            renderPage(0);
        };
    </script>
